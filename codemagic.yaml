workflows:
  build-nootedgreen:
    name: Build NootedGreen
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      xcode: latest
    scripts:
      - name: Show Xcode
        script: |
          set -euxo pipefail
          xcodebuild -version
          sw_vers
          uname -a
      - name: Inspect project
        script: |
          set -euxo pipefail
          pwd
          ls -la
          xcodebuild -list -project NootedGreen.xcodeproj
          test -d Lilu.kext/Contents/Resources/Headers
          test -d MacKernelSDK/Headers
          test -f MacKernelSDK/Library/x86_64/libkmod.a
      - name: Build
        script: |
          set -euxo pipefail
          rm -rf build
          xcodebuild \
            -project NootedGreen.xcodeproj \
            -scheme NootedGreen \
            -configuration Release \
            -derivedDataPath build/DerivedData \
            ARCHS=x86_64 \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            build | tee build/xcodebuild.log
      - name: Find kext
        script: |
          set -euxo pipefail
          find build -name "NootedGreen.kext" -print
          find build -name "*.zip" -print
    artifacts:
      - build/DerivedData/Build/Products/Release/NootedGreen.kext
      - build/DerivedData/Build/Products/Release/*.zip
      - build/xcodebuild.log
